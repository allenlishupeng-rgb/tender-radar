- name: 苏州市公共资源交易平台
  enabled: true
  default_selected: true
  base_url: https://ggzy.suzhou.gov.cn/
  crawler: suzhou_public
  query_strategy: crawler_managed
  search_terms: [展厅, 展陈, 布展, 展示中心, 数字展厅, 展厅设计, 产业展示中心, 企业展厅, 展馆, 产业展厅, 产业馆, 总部展厅, 品牌展厅, 产品展示中心, 科技展厅, 企业文化展厅]
  max_pages: 1
  max_terms: 16
  detail_enrichment_limit: 8
  result_limit: 30
  min_relevance_score: 25
  source_timeout_seconds: 65
  request_timeout: 8
  notes: 使用苏州本地公共资源交易平台公开全文检索接口，覆盖建设工程、政府采购、国企采购及其他交易，再本地筛选展厅、展馆、展陈、布展、数字展厅等业务线索。
